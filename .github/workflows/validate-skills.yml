name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile check
        run: python -m compileall -q scripts tests

      - name: Run validator unit tests
        run: python -m unittest discover

      - name: Validate skill structure and Markdown links
        run: python scripts/validate_skills.py --root .

      - name: Validate evaluation specifications
        run: python scripts/validate_evals.py --root .

      - name: Validate Find Your Coach routing
        run: python scripts/validate_finder.py --root .
